<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section class="card">
        <img id="image" src="snortleblat.jpg" alt="Character Card">
        <h2 id="name"></h2>
        <div id="stats">
            <p>Class: <span id="class"></span></p>
            <p>Level: <span id="level"></span></p>
            <p>Health: <span id="health"></span></p>
        </div>
        <button id="attacked" class="buttons">Attacked</button>
        <button id="leveler" class="buttons">Level Up</button>
    </section>
</body>
</html>
